# Add the persisted goal domain and its model-facing tools to the real one-shot app.
- id: base
  name: '@open-harness/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - insert:
          - id: goal
            name: '@open-harness/oh-goal'
          - id: tool-goal
            name: '@open-harness/oh-tool-goal'
