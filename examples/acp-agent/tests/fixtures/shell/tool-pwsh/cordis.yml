# Minimal tool-pwsh composition: real app boot path, real pwsh executor, real
# foreground + background tool calls; driven by the package's loader.spec.ts.
- id: system-prompt
  name: '@open-harness/oh-system-prompt'

- id: tools
  name: '@open-harness/oh-tools'

- id: subprocess
  name: '@open-harness/oh-subprocess-local'

- id: bash
  name: '@open-harness/oh-pwsh-local'
  config:
    graceMs: 200

- id: shell-env
  name: '@open-harness/oh-shell-env'

- id: tasks
  name: '@open-harness/oh-jobs-local'

- id: tool-jobs
  name: '@open-harness/oh-tool-jobs'

- id: tool-pwsh
  name: '@open-harness/oh-tool-pwsh'
