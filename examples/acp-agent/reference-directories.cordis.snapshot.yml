# Keyless replay of the reference-directories scenario: the base example with
# the live DeepSeek adapter disabled and llm-replay inserted to serve the
# hand-written override (the scenario is authored, never re-recorded), plus the
# workspace-references row the live overlay adds. The acp-agent config patch
# restates the base fields verbatim and re-pins deepseek-v4-flash, mirroring
# cordis.snapshot.yml.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      # `name` asserts the target: a mismatch skips the patch and warns only when
      # a logger exists. A renamed id leaves a stale adapter entry, but replay still
      # short-circuits through `llm-replay`.
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - id: acp-agent
        name: '@deepseek-ai/dsh-acp-demo'
        config:
          provider: deepseek-official
          model: deepseek-v4-flash
          persistenceRoot: !!js process.env.DSH_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
          # Replay fixtures are raw JSONL; the whole-config patch must restate
          # the compression choice or the default zstd frames hide the logs
          # from the harness's harvest.
          persistenceCompression: none
          workspaceContext:
            maxBytes: 65536
          persona: |
            You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}. Your bash tool runs under a file sandbox — a `[sandbox: file access denied …]` result is policy, not a command bug.

            Verify your work by running the code or tests. Keep answers brief and factual.
      - id: sandbox
        name: '@deepseek-ai/dsh-sandbox-local'
        config:
          runnerCommand:
            - bash
            - -c
            - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
            - passthrough-runner
          runnerFailureSignatures:
            - 'passthrough-runner: profile rejected'
      - insert:
          - id: workspace-references
            name: '@deepseek-ai/dsh-workspace-references'
          - id: llm-replay
            name: '@deepseek-ai/dsh-llm-replay'
            config:
              providers:
                - id: deepseek-official
                  name: DeepSeek
                  models:
                    - id: deepseek-v4-flash
                    - id: deepseek-v4-pro
          # Authored scenarios can fence a later parent action on the real
          # child settlement edge without exposing a test-only model tool.
          - id: subagent-settlement-marker
            name: './tests/fixtures/subagent-settlement-marker.ts'
