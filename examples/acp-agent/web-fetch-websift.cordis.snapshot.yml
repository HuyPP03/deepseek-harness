# Keyless replay counterpart to web-fetch-websift.cordis.yml: the web stack
# and the SSRF-safe websift provider stay real (the tool calls re-execute the
# actual preflight refusals); only the model adapter is replaced by replay.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - insert:
          - id: web
            name: '@deepseek-ai/dsh-web'
          - id: web-fetch-websift
            name: '@deepseek-ai/dsh-web-fetch-websift'
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              search: false
          - id: llm-replay
            name: '@deepseek-ai/dsh-llm-replay'
            config:
              providers:
                - id: deepseek-official
                  name: DeepSeek
                  models:
                    - id: deepseek-v4-flash
                    - id: deepseek-v4-pro
