# Web-fetch-websift composition for the web-fetch-websift snapshot scenario:
# the web seam, the SSRF-safe websift fetch provider, and the model-facing
# web_fetch tool (fetch only, so the pinned header carries exactly the surface
# under test). The scenario prompt fetches loopback URLs the provider's
# preflight refuses before any request leaves the process — deterministic,
# keyless, and free of external network in replay alike.
- id: base
  name: '@open-harness/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - insert:
          - id: web
            name: '@open-harness/oh-web'
          - id: web-fetch-websift
            name: '@open-harness/oh-web-fetch-websift'
          - id: tool-web
            name: '@open-harness/oh-tool-web'
            config:
              search: false
