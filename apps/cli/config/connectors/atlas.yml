id: atlas
name: Atlassian
description: Jira issues and Confluence pages on Atlassian Cloud.
presetId: atlas
workspaceDirName: atlassian
products: [jira, confluence]
auth:
  - mode: oauth
    serverUrl: https://mcp.atlassian.com/v1/mcp/authv2
    setupGuide:
      - Sign in with your Atlassian Cloud account; your site admin may need to authorize the MCP app first.
      - The sign-in grants the connector the Jira and Confluence scopes your account can use.
    reauthHint: "If Atlassian asks you to sign in again, the previous authorization expired: re-run the sign-in."
servers:
  - serverName: atlas
    transport: streamable-http
    url: https://mcp.atlassian.com/v1/mcp/authv2
suggestions:
  - List the issues assigned to me
  - Summarize the Confluence page for this project
